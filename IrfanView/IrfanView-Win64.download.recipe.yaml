Description: Downloads the latest version of IrfanView x64 for Windows.
Identifier: com.github.NickETH.recipes.download.IrfanView-Win64
MinimumVersion: 1.3.1

Input:
  NAME: IrfanView
  VENDOR: 'Irfan Skiljan'
  PLATFORM: x64
  PF_STRING: _64
  SEARCH_URL: https://www.irfanview.com/64bit.htm
  #SEARCH_URL_PLUG: 'https://www.heise.de/download/product/irfanview-plugins-73737/download'
  SEARCH_URL_PLUG: 'https://www.techspot.com/downloads/472-irfanview-plugins.html'
  # <a href="https://www.irfanview.info/files/iview466g_x64.zip" class="alt-download">Download von IrfanView-64</a> iview466_x64_setup.exe
  VERSION_URL: (https://www.irfanview.info/files/(?P<mainfile>iview(?P<versionraw>[0-9]+)g_x64_setup\.exe))
  # aktuell von FF: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:134.0) Gecko/20100101 Firefox/134.0
  USER_AGENT: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:134.0) like Gecko
  
  # A new processor (IrfanViewDownloader) based on Playwright was needed to download the files.
  # There are no places anymore to download without loading a webpage and clicking.

Process:
- Processor: URLTextSearcher
  Comment: Get the exact path from the download page.
  Arguments:
    re_pattern: '%VERSION_URL%'
    request_headers:
      user-agent: '%USER_AGENT%'
    url: '%SEARCH_URL%'

- Processor: com.github.NickETH.recipes.SharedProcessors/ExecuteFile
  Comment: create a version.txt file, if it does not exist
  Arguments:
    cmdline_args:
    - /C
    - type
    - nul
    - '>>'
    - version.txt
    exe_file: 'cmd.exe'
    exe_folder: '%RECIPE_CACHE_DIR%'

- Processor: URLTextSearcher
  Comment: Get the version from version.txt. Preserve the output of match to NEW_URL.
  Arguments:
    re_pattern: '^(.*)$'
    url: file://%RECIPE_CACHE_DIR%/version.txt
    NEW_URL: '%match%'

- Processor: StopProcessingIf
  Arguments:
    predicate: '%versionraw% == %match%'

- Processor: IrfanViewDownloader
  Comment: Download the main installer.
  Arguments:
    file_path: '%RECIPE_CACHE_DIR%\downloads\IrfanView_%PLATFORM%.exe'
    url: '%NEW_URL%'
    main_file: '%mainfile%'

- Processor: com.github.sebtomasi.SharedProcessors/TextSubstituer
  Comment: Generate the url for the plugins download.
  Arguments:
    input_string: '%NEW_URL%'
    pattern_replace:
    - pattern: g_x64_setup
      repl: _plugins_x64_setup

- Processor: com.github.sebtomasi.SharedProcessors/TextSubstituer
  Comment: Generate the name for the plugins file. Save the output of parsed_string to url.
  Arguments:
    url: '%parsed_string%'
    input_string: '%mainfile%'
    pattern_replace:
    - pattern: g_x64_setup
      repl: _plugins_x64_setup

- Processor: IrfanViewDownloader
  Comment: Download the plugins installer.
  Arguments:
    file_path: '%RECIPE_CACHE_DIR%\downloads\IrfanView_plugins_%PLATFORM%.exe'
    url: '%url%'
    main_file: '%parsed_string%'
    
- Processor: WindowsSignatureVerifier
  Comment: Check the signature on the downloaded file
  Arguments:
    input_path: '%RECIPE_CACHE_DIR%\downloads\IrfanView_%PLATFORM%.exe'
    expected_subject: CN=Irfan Skiljan, O=Irfan Skiljan, S=Lower Austria, C=AT

- Processor: com.github.NickETH.recipes.SharedProcessors/WinPEVersionExtractor
  Arguments:
    exe_file: '%NAME%_%PLATFORM%.exe'
    filename: '%NAME%_Plugins_%PLATFORM%.exe'
    #exe_path: '%pathname%'
    exe_path: '%RECIPE_CACHE_DIR%\downloads\IrfanView_%PLATFORM%.exe'
    product_version: 'True'

- Processor: FileCreator
  Comment: Generate the version.txt in the release dir.
  Arguments:
    file_content: '%versionraw%'
    file_path: '%RECIPE_CACHE_DIR%\version.txt'

- Processor: EndOfCheckPhase
